server {
    listen 80;
    server_name _;

    # Enable gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # Serve static files from the built frontend
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------
    # 🖼️ Serve image files directly from /app/images
    # IMPORTANT: This must come BEFORE the generic /api/ proxy
    # to prevent images from being forwarded to backend
    # ----------------------------------------------------
    location ^~ /api/images/ {
        alias /app/images/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # ----------------------------------------------------
    # 🔗 API proxy - forward all other /api/* requests to backend
    # Note: trailing slash in proxy_pass URL causes /api to be stripped
    # /api/listings -> http://backend:8000/listings
    # ----------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running agent operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }


    # Cache static assets (JS, CSS, images) for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve images directory
    location /images/ {
        alias /app/images/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Serve output directory (for screenshots/proofs)
    location /output/ {
        alias /app/output/;
        expires 1d;
        add_header Cache-Control "private";
    }

    # Frontend routes - fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
