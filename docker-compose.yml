services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./backend/data:/data
      - ./images:/app/images
      - ./output:/app/output
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /data/housing.db
    restart: unless-stopped
  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
      SCRAPER_VERSION: homepilot-docker
      SLEEP_SECONDS: "60"
    volumes:
      - ./images:/app/images
      - ./backend/data:/data   
    working_dir: /app/
    command: ["python", "src/main.py"]
    restart: unless-stopped

  datasette:
    image: datasetteproject/datasette
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/data 
    command: ["datasette", "serve", "/data/housing.db", "--host", "0.0.0.0", "--port", "8001"]

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./images:/app/images:ro
      - ./output:/app/output:ro
    restart: unless-stopped
